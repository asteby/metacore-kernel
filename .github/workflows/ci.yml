name: CI

on:
  push:
    branches: [main]
  # Sin filtro de base: los PRs apilados (rama -> rama) tambien corren CI.
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - name: ed25519 verify gate (only vetted packages may verify; baseline shrinks only)
        run: |
          git fetch --no-tags --depth=1 origin main
          scripts/check-ed25519-verify.sh origin/main
      - name: kernel neutrality gate (no niche vocabulary / Spanish prose in non-test code; baseline shrinks only)
        run: scripts/check-kernel-neutrality.sh origin/main
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
        continue-on-error: true

  # Addon migration runner against a real Postgres (search_path / schema
  # resolution can't be exercised with sqlite or sqlmock). Scratch DB only.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kernel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres dbname=kernel_test sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - run: go test -count=1 -v -run 'Postgres' ./dynamic/
      # CON-01 (50 creaciones concurrentes) vive en subtests ".../Postgres_*": el
      # `-run 'Postgres'` de arriba solo mira nombres de nivel superior y no lo
      # ejecuta. `-count=1` y -v dejan ver que NO se salta.
      - run: |
          go test -count=1 -v -run 'SequencesV2_CON01/Postgres' ./dynamic/ | tee con01.log
          ! grep -q -- '--- SKIP' con01.log
          grep -q -- '--- PASS: TestSequencesV2_CON01_ConcurrentCreates/Postgres' con01.log
      # El installer también tiene tests que necesitan Postgres real (gated por
      # TEST_POSTGRES_DSN y que, sin esto, se SALTAN en silencio): el pre-flight de
      # Upgrade (rollback sin tocar la versión instalada), las columnas de
      # auditoría añadidas antes de las migraciones (caso customers@037) y las
      # reglas unique. Sin este paso un verde del job no prueba nada de eso.
      - run: go test -count=1 -v ./installer/
      # data_mutate sobre tabla sin columnas de auditoría (legacy), Postgres real.
      - run: go test -count=1 -v -run 'Postgres' ./runtime/wasm/
      # Bus durable y libro de entregas en Postgres real: reclamo SKIP LOCKED entre
      # réplicas, publicar/matar/reiniciar y el índice del barredor (CONCURRENTLY,
      # candado entre réplicas). Sin este paso se SALTAN en silencio.
      - run: go test -count=1 -race -v -run 'DurablePG' ./dispatch/
      - run: go test -count=1 -race -v -run '/Postgres' ./idempotency/ ./outbox/
      # Recibos de inbound: reserva atómica con conexiones concurrentes reales, reclamo de arriendo vencido y cerca por intento.
      - run: go test -count=1 -race -v -run '/Postgres' ./inbound/
      # Ledger de pagos: holds y cobros concurrentes, índices parciales, NUMERIC.
      - run: go test -count=1 -race -v -run '/Postgres' ./payments/ledger/
      # Puente legado: candado por fila y cursor con dos aplicadores a la vez.
      - run: go test -count=1 -race -v -run '/postgres' ./legacybridge/
      # Diagnostico de addons: concurrencia del agregador, jsonb y migracion 0009 en Postgres real.
      - run: go test -count=1 -race -v -run 'Postgres|Concurrency' ./diag/
      # Fuzz del saneado (un objetivo por invocacion).
      - run: go test -run '^$' -fuzz '^FuzzSanitize$' -fuzztime 20s ./diag/
      - run: go test -run '^$' -fuzz '^FuzzExtractBody$' -fuzztime 20s ./diag/
      - run: go test -run '^$' -fuzz '^FuzzScrubText$' -fuzztime 20s ./diag/
