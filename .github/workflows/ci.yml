name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - run: go vet ./...
      - run: go test -race -coverprofile=coverage.out ./...
      - uses: codecov/codecov-action@v7
        with:
          files: coverage.out
        continue-on-error: true

  # Addon migration runner against a real Postgres (search_path / schema
  # resolution can't be exercised with sqlite or sqlmock). Scratch DB only.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: kernel_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_POSTGRES_DSN: host=localhost port=5432 user=postgres password=postgres dbname=kernel_test sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache: true
      - run: go test -count=1 -v -run 'Postgres' ./dynamic/
      # El installer también tiene tests que necesitan Postgres real (gated por
      # TEST_POSTGRES_DSN y que, sin esto, se SALTAN en silencio): el pre-flight de
      # Upgrade (rollback sin tocar la versión instalada), las columnas de
      # auditoría añadidas antes de las migraciones (caso customers@037) y las
      # reglas unique. Sin este paso un verde del job no prueba nada de eso.
      - run: go test -count=1 -v ./installer/
      # data_mutate sobre tabla sin columnas de auditoría (legacy), Postgres real.
      - run: go test -count=1 -v -run 'Postgres' ./runtime/wasm/
      - run: go test -count=1 -race -v -run '/Postgres' ./idempotency/ ./outbox/
